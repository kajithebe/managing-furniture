name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Server
      - name: Server - install
        working-directory: server
        run: npm ci

      - name: Server - security audit
        working-directory: server
        run: npm audit --audit-level=high

      - name: Server - lint
        working-directory: server
        run: npm run lint

      - name: Server - build
        working-directory: server
        run: npm run build --if-present

      # Client
      - name: Client - install
        working-directory: client
        run: npm ci

      - name: Client - security audit
        working-directory: client
        run: npm audit --audit-level=high

      - name: Client - lint
        working-directory: client
        run: npm run lint

      - name: Client - build
        working-directory: client
        run: npm run build